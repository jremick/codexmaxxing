<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Ways to structure parallel Codex work</title>
  <desc id="desc">Four simple shapes for running Codex work: single-thread, hub-and-spoke, pipeline, and portfolio board.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
    <style>
      .bg { fill: #f7f4ec; }
      .panel { fill: #fffdf7; stroke: #222222; stroke-width: 2; }
      .title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 800; fill: #151515; }
      .subtitle { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; fill: #4d4d4d; }
      .label { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #151515; }
      .small { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #555555; }
      .node { stroke: #222222; stroke-width: 2; }
      .hub { fill: #2f6f73; }
      .agent { fill: #e2a93b; }
      .verify { fill: #ca5a48; }
      .context { fill: #6f78b8; }
      .ink { fill: #ffffff; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #222222; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .softedge { stroke: #555555; stroke-width: 2; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="640"/>
  <text x="48" y="58" class="title">Ways to structure parallel Codex work</text>
  <text x="48" y="90" class="subtitle">Pick a shape that fits the work. Handoffs, checks, and integration follow.</text>

  <rect class="panel" x="48" y="124" width="532" height="194" rx="16"/>
  <text x="78" y="160" class="label">Single task</text>
  <text x="78" y="185" class="small">Best when judgment is tight or the edit is risky.</text>
  <rect class="node hub" x="104" y="226" width="116" height="46" rx="9"/>
  <text class="ink" x="162" y="249">Goal</text>
  <path class="edge" d="M 226 249 H 286"/>
  <rect class="node context" x="294" y="226" width="116" height="46" rx="9"/>
  <text class="ink" x="352" y="249">Codex</text>
  <path class="edge" d="M 416 249 H 476"/>
  <rect class="node verify" x="484" y="226" width="72" height="46" rx="9"/>
  <text class="ink" x="520" y="249">Check</text>
  <text x="104" y="294" class="small">One owner, one loop, clear evidence.</text>

  <rect class="panel" x="620" y="124" width="532" height="194" rx="16"/>
  <text x="650" y="160" class="label">Hub-and-spoke</text>
  <text x="650" y="185" class="small">Best for independent research, review, or file slices.</text>
  <rect class="node hub" x="836" y="226" width="116" height="48" rx="9"/>
  <text class="ink" x="894" y="250">Parent</text>
  <rect class="node agent" x="662" y="232" width="108" height="38" rx="9"/>
  <text class="ink" x="716" y="251">Agent A</text>
  <rect class="node agent" x="1010" y="232" width="108" height="38" rx="9"/>
  <text class="ink" x="1064" y="251">Agent B</text>
  <rect class="node context" x="836" y="282" width="116" height="36" rx="9"/>
  <text class="ink" x="894" y="300">Verifier</text>
  <path class="edge" d="M 836 250 H 776"/>
  <path class="edge" d="M 952 250 H 1004"/>
  <path class="softedge" d="M 894 274 V 278"/>
  <text x="662" y="294" class="small">Parent integrates.</text>

  <rect class="panel" x="48" y="360" width="532" height="214" rx="16"/>
  <text x="78" y="396" class="label">Pipeline</text>
  <text x="78" y="421" class="small">Best when stages have stable outputs.</text>
  <rect class="node context" x="96" y="462" width="96" height="42" rx="9"/>
  <text class="ink" x="144" y="483">Map</text>
  <path class="edge" d="M 198 483 H 250"/>
  <rect class="node agent" x="258" y="462" width="96" height="42" rx="9"/>
  <text class="ink" x="306" y="483">Build</text>
  <path class="edge" d="M 360 483 H 412"/>
  <rect class="node hub" x="420" y="462" width="96" height="42" rx="9"/>
  <text class="ink" x="468" y="483">Review</text>
  <rect class="node verify" x="248" y="520" width="156" height="36" rx="9"/>
  <text class="ink" x="326" y="538">Verify or loop</text>
  <path class="edge" d="M 468 506 C 468 540, 414 546, 410 538"/>
  <path class="edge" d="M 248 538 C 180 538, 168 506, 192 492"/>

  <rect class="panel" x="620" y="360" width="532" height="214" rx="16"/>
  <text x="650" y="396" class="label">Portfolio board</text>
  <text x="650" y="421" class="small">Best for multiple projects with separate checks.</text>
  <rect class="node hub" x="662" y="472" width="120" height="46" rx="9"/>
  <text class="ink" x="722" y="495">Board</text>
  <path class="edge" d="M 788 495 H 846"/>
  <rect class="node agent" x="854" y="438" width="108" height="38" rx="9"/>
  <text class="ink" x="908" y="457">Project 1</text>
  <rect class="node context" x="854" y="492" width="108" height="38" rx="9"/>
  <text class="ink" x="908" y="511">Project 2</text>
  <rect class="node verify" x="1010" y="466" width="114" height="40" rx="9"/>
  <text class="ink" x="1067" y="486">Review queue</text>
  <path class="edge" d="M 962 457 C 988 457, 988 486, 1004 486"/>
  <path class="edge" d="M 962 511 C 988 511, 988 486, 1004 486"/>
  <text x="662" y="548" class="small">State, blockers, next check. Nothing fancier unless it earns it.</text>
</svg>
