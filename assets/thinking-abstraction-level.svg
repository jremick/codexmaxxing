<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Thinking Abstraction Level ladder</title>
  <desc id="desc">A ladder showing movement from tiny tasks to broad goals where Codex works out more of the path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="48%" stop-color="#142137"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="high" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="30" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="80" y="86" fill="#f8fafc" font-size="48" font-weight="900">Thinking Abstraction Level</text>
    <text x="82" y="124" fill="#cbd5e1" font-size="22">The maxxing move is choosing the right level, then letting Codex design the path down.</text>
  </g>
  <g filter="url(#soft)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="98" y="466" width="1004" height="78" rx="18" fill="#172033" stroke="#64748b" stroke-width="2"/>
    <rect x="146" y="362" width="908" height="78" rx="18" fill="#172033" stroke="#818cf8" stroke-width="2"/>
    <rect x="194" y="258" width="812" height="78" rx="18" fill="#172033" stroke="#22d3ee" stroke-width="2"/>
    <rect x="242" y="154" width="716" height="78" rx="18" fill="#172033" stroke="#facc15" stroke-width="2"/>
    <text x="126" y="514" fill="#f8fafc" font-size="27" font-weight="800">L0: Do this exact edit</text>
    <text x="455" y="514" fill="#cbd5e1" font-size="20">useful, but you carry the plan</text>
    <text x="174" y="410" fill="#f8fafc" font-size="27" font-weight="800">L1: Complete this task</text>
    <text x="500" y="410" fill="#cbd5e1" font-size="20">Codex follows the frame</text>
    <text x="222" y="306" fill="#f8fafc" font-size="27" font-weight="800">L2: Design the approach</text>
    <text x="580" y="306" fill="#cbd5e1" font-size="20">plan, checks, work split</text>
    <text x="270" y="202" fill="#f8fafc" font-size="27" font-weight="800">L3: Achieve this outcome</text>
    <text x="640" y="202" fill="#cbd5e1" font-size="20">Codex owns more of the path</text>
  </g>
  <path d="M1030 505 C1090 410 1108 276 936 184" fill="none" stroke="url(#high)" stroke-width="8" stroke-linecap="round"/>
  <path d="M936 184 l42 -4 l-19 38 z" fill="#facc15"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="98" y="592" fill="#e2e8f0" font-size="22">Higher abstraction does not mean less clarity.</text>
    <text x="98" y="620" fill="#94a3b8" font-size="18">It means clearer success criteria, permission boundaries, and verification.</text>
  </g>
</svg>
